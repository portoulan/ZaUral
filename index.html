<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Интерактивная карта миграций</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <main id="app">
    <div id="map"></div>
    <section class="panel">
      <div class="panel-title">
        <div>
          <h1>Миграции</h1>
          <div id="yearLabel">1896</div>
        </div>
        <button id="panelToggle" class="icon-btn" title="Свернуть меню">☰</button>
      </div>

      
<div class="controls" id="menuBody">
  <div class="control-section">
    <div class="control-title">Управление</div>
    <div class="control-row">
      <button id="flowsBtn" class="primary">Потоки: включены</button>
      <button id="animationBtn">Анимация: выключена</button>
      <button id="speedBtn">Скорость: ×1</button>
    </div>
  </div>

  <div class="control-section">
    <div class="control-title">Год</div>
    <div class="year-navigation"><button id="prevYearBtn" class="year-arrow" title="Предыдущий год">←</button><div class="years" id="yearButtons"></div><button id="nextYearBtn" class="year-arrow" title="Следующий год">→</button></div>
  </div>

  <div class="actions">
    <button id="tablesBtn">Таблицы</button>
    <button id="chartsBtn">Диаграммы</button>
    <button id="mapsBtn">Карты</button>
  </div>

  <div id="tablesPanel" class="tables-panel hidden">
    <div class="section-title">Таблицы</div>
    <div class="table-tabs">
      <button id="fromBtn">Исход</button>
      <button id="toBtn">Водворение</button>
    </div>
    <div id="tablePanel" class="table-panel hidden">
      <div class="table-head">
        <strong id="tableTitle"></strong>
        <button id="closeTable" class="icon-btn">×</button>
      </div>
      <div id="tableContent"></div>
    </div>
  </div>

  <div id="chartsPanel" class="charts-panel hidden">
    <div class="section-title">Диаграммы</div>
    <div class="chart-tabs">
      <button id="fromChartBtn">Исход</button>
      <button id="toChartBtn">Водворение</button>
    </div>
    <div class="chart-wrap"><canvas id="migrationChart"></canvas></div>
  </div>

  <div id="mapsPanel" class="maps-panel hidden">
    <div class="section-title">Карты</div>
    <div class="map-tabs">
      <button id="fromMapBtn">Исход</button>
      <button id="toMapBtn">Водворение</button>
    </div>
    <div id="mapLegend" class="map-legend"></div>
  </div>

  <div id="status" class="status">Загрузка данных…</div>
</div>
</div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-ant-path@1.3.0/dist/leaflet-ant-path.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
