<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Карта миграций</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="map"></div>

<div id="panel">

    <h2>Миграции</h2>

    <label>
        Год
        <select id="yearSelect">
            <option value="all">Все годы</option>
        </select>
    </label>

    <label>
        Минимальный поток
        <input
            type="range"
            id="minFlow"
            min="0"
            max="1000"
            value="0"
            step="10"
        >
        <span id="minFlowValue">0</span>
    </label>

    <div class="checkbox-row">
        <label>
            <input type="checkbox" id="showNodes" checked>
            Показывать узлы
        </label>
    </div>

    <div class="checkbox-row">
        <label>
            <input type="checkbox" id="showRegions" checked>
            Показывать регионы
        </label>
    </div>

    <hr>

    <div id="info">
        <p>Выберите регион или поток на карте.</p>
    </div>

</div>

<div id="legend">
    <b>Количество переселенцев</b>

    <div class="legend-line small"></div>
    <span>100</span>

    <div class="legend-line medium"></div>
    <span>1 000</span>

    <div class="legend-line large"></div>
    <span>10 001+</span>
</div>

<div id="animationControls">
    <button id="animationToggle">▶ Запустить потоки</button>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.3/papaparse.min.js"></script>

<script src="script.js"></script>

</body>
</html>
